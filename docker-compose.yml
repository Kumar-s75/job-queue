services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: forgequeue, POSTGRES_USER: forgequeue, POSTGRES_PASSWORD: forgequeue }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U forgequeue"], interval: 2s, timeout: 2s, retries: 20 }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgres://forgequeue:forgequeue@postgres/forgequeue
      RUST_LOG: forgequeue=info,tower_http=info
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
volumes: { postgres-data: {} }
